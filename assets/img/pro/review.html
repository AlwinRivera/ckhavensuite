<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CK Haven pro set</title>
<style>
:root{--bg:#fff;--fg:#1d1d1f;--muted:#6e6e73}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--fg:#f2f2f2;--muted:#a1a1a6}}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif}
h1{font-size:20px;margin:4px 0 2px}h2{font-size:16px;margin:28px 0 10px}p{color:var(--muted);margin:0 0 12px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
figure{margin:0}img,video{width:100%;border-radius:10px;display:block;background:#0001}
figcaption{font-size:13px;color:var(--muted);margin-top:6px}
.r{display:grid;grid-template-columns:1fr 2fr;gap:8px}.r img{height:220px;object-fit:cover}
</style></head><body>
<h1>CK Haven: pro photo and video set</h1>
<p>AI-generated from your real photos. Left: your original. Right: the new shot.</p>
<h2>Photos (12)</h2>
<div class="g">
<figure><div class="r"><img src="../living-room.jpg"><img src="living-hero-640.webp"></div><figcaption>Living room, wide hero</figcaption></figure>
<figure><div class="r"><img src="../living-tv.jpg"><img src="living-tv-640.webp"></div><figcaption>Living room, TV wall</figcaption></figure>
<figure><div class="r"><img src="../living-sofa.jpg"><img src="sofa-640.webp"></div><figcaption>Sofa bed and painting</figcaption></figure>
<figure><div class="r"><img src="../bedroom.jpg"><img src="bedroom-hero-640.webp"></div><figcaption>Bedroom, hero</figcaption></figure>
<figure><div class="r"><img src="../bedroom-vanity.jpg"><img src="bedroom-wardrobe-640.webp"></div><figcaption>Bedroom, wardrobe and vanity</figcaption></figure>
<figure><div class="r"><img src="../bedroom-wide.jpg"><img src="bed-detail-640.webp"></div><figcaption>Bed detail</figcaption></figure>
<figure><div class="r"><img src="../kitchen.jpg"><img src="kitchen-wide-640.webp"></div><figcaption>Kitchen</figcaption></figure>
<figure><div class="r"><img src="../bathroom.jpg"><img src="bathroom-640.webp"></div><figcaption>Bathroom (sink and shower in one frame)</figcaption></figure>
<figure><div class="r"><img src="../shower.jpg"><img src="shower-640.webp"></div><figcaption>Shower corner</figcaption></figure>
<figure><div class="r"><img src="../garden-patio.jpg"><img src="garden-hero-640.webp"></div><figcaption>Garden from the steps</figcaption></figure>
<figure><div class="r"><img src="../garden-steps.jpg"><img src="garden-detail-640.webp"></div><figcaption>Patio, eye level</figcaption></figure>

</div>

<figure><video src="../../video/pro/garden.mp4" poster="../../video/pro/garden.jpg" muted loop autoplay playsinline></video><figcaption>Garden descent · 4 s (trimmed)</figcaption></figure>
</div>
</body></html>
