<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found · CK Haven</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="/ckhavensuite/assets/brand/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #222; --muted: #6a6a6a; --sand: #f7f3ee; --brand: #a3425b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--sand); color: var(--ink); font: 400 1rem/1.5 Inter, system-ui, sans-serif; padding: 24px 16px; }
    main { max-width: 460px; text-align: center; }
    .code { font: 600 0.875rem Inter, sans-serif; letter-spacing: 0.12em; color: var(--brand); text-transform: uppercase; }
    h1 { font: 600 clamp(2rem, 6vw, 2.75rem)/1.1 Fraunces, Georgia, serif; margin: 12px 0; }
    p { color: var(--muted); margin: 0 0 28px; }
    .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a.btn { display: inline-flex; align-items: center; min-height: 48px; padding: 12px 24px; border-radius: 999px; font-weight: 600; text-decoration: none; border: 1px solid var(--ink); color: var(--ink); background: #fff; }
    a.btn.dark { background: var(--ink); color: #fff; }
  </style>
</head>
<body>
  <main>
    <div class="code">404 · Page not found</div>
    <h1>This page checked out early.</h1>
    <p>The link may be old or mistyped. The suite, photos and booking are all still here.</p>
    <div class="row">
      <a class="btn dark" href="/ckhavensuite/">Go to CK Haven</a>
      <a class="btn" href="/ckhavensuite/property.html?id=ck-haven-suite">See the suite</a>
    </div>
  </main>
</body>
</html>
