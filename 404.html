    a.btn { display: inline-flex; align-items: center; min-height: 48px; padding: 12px 24px; border-radius: 5px; font-weight: 500; text-decoration: none; border: 1px solid var(--navy); color: var(--navy); background: #fff; }

  </style>
</head>
