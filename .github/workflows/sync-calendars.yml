name: Sync calendars

on:
  schedule:
    - cron: "17 * * * *" # hourly
  workflow_dispatch:
  push:
    paths:
      - data/site.json
      - data/direct-bookings.json

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-calendars.mjs
      - name: Commit if changed
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add data/availability.json ical/
          git diff --cached --quiet || (git commit -m "Sync calendars" && git push)
